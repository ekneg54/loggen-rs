[package]
name = "loggen"
description = "a log generator"
version = "0.5.0"
edition = "2021"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
tera = { version = "2.4", features = ["fast"] }
tera-contrib = { version = "0.3", features = ["base64", "filesize_format", "json", "rand", "regex", "slug", "urlencode"] }
rand = "0.10"
rayon = "1.12"
regex = "1.13"
ureq = "3.5"
serde_json = "1.0.154"
ctrlc = "3.5"

rdkafka = { version = "0.39", optional = true }

[features]
default = []
kafka = ["rdkafka"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false
